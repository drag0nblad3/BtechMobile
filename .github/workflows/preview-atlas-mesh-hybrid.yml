name: Atlas triangle source / damage hybrid QA (no APK)
on:
  push:
    branches: [feature/atlas-mesh-first-v5]
    paths:
      - tools/capture_atlas_mesh_hybrid.gd
      - tools/export_atlas_source_obj.gd
      - src/view/units/voxel_surface_nets.gd
      - src/view/units/atlas_source_mesh.gd
      - src/view/units/atlas_mesh_voxelizer.gd
      - src/view/units/voxel_reference_v4.gd
      - src/view/units/voxel_mech_art.gd
      - src/view/units/voxel_part.gd
      - src/view/units/voxel_mech_rig.gd
      - src/view/units/voxel_mech_lab.gd
      - data/graphics/voxel_chassis.json
      - .github/workflows/preview-atlas-mesh-hybrid.yml
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.5.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.1-stable_linux.x86_64.zip
          mv Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import model scripts
        run: godot --headless --import
      - name: Export editable mesh source (no voxels)
        run: |
          set -o pipefail
          mkdir -p /tmp/atlas-source
          godot --headless -s tools/export_atlas_source_obj.gd -- /tmp/atlas-source 2>&1 | tee atlas-mesh-export.log
          [ "$(grep -c '^ATLAS_OBJ|' atlas-mesh-export.log)" -eq 9 ]
          ! grep -E 'SCRIPT ERROR|Parse Error|ATLAS_OBJ_FAILED' atlas-mesh-export.log
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-original-editable-obj-meshes
          path: /tmp/atlas-source/*.obj
      - name: Render actual voxel anatomy from branch
        run: |
          set -o pipefail
          mkdir -p /tmp/atlas-mesh-hybrid
          xvfb-run -a godot --rendering-method gl_compatibility --resolution 1280x800 \
            -s tools/capture_atlas_mesh_hybrid.gd -- /tmp/atlas-mesh-hybrid 2>&1 | tee atlas-mesh-render.log
          [ "$(grep -c '^ATLAS_MESH_RENDER|' atlas-mesh-render.log)" -eq 4 ]
          for f in atlas-mesh-3quarter atlas-mesh-front atlas-mesh-side atlas-after-damage; do
            test -s "/tmp/atlas-mesh-hybrid/$f.png"
          done
          ! grep -E 'SCRIPT ERROR|Parse Error|RENDER_FAILED' atlas-mesh-render.log
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-mesh-source-and-damage-godot-review
          path: /tmp/atlas-mesh-hybrid/*.png
