name: Inherited Mech fragment diagnostics
on:
  push:
    branches: [chatgpt/repair-held-sculpts-compare-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.1-stable_linux.x86_64.zip
          mv Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
      - run: godot --headless --import
      - run: |
          set -o pipefail
          godot --headless -s tools/vx_inherited_fragment_diagnostics.gd 2>&1 | tee inherited.log
          ! grep -E 'SCRIPT ERROR|Parse Error' inherited.log
      - uses: actions/upload-artifact@v4
        with:
          name: inherited-fragment-diagnostics
          path: inherited.log
