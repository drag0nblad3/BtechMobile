name: Temporary six-mech render review
on:
  push:
    branches:
      - art/new-source-mechs-shape-first-20261122
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.5.1-stable_linux.x86_64
          sudo mv /tmp/Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Capture both groups front side three quarter top rear
        run: |
          set -euo pipefail
          godot --headless --import
          mkdir -p /tmp/new-model-render/a /tmp/new-model-render/b
          timeout 130s xvfb-run -a godot --rendering-method gl_compatibility --resolution 1500x900 -s tools/_temporary_sculpt_gallery_a.gd -- /tmp/new-model-render/a
          timeout 130s xvfb-run -a godot --rendering-method gl_compatibility --resolution 1500x900 -s tools/_temporary_sculpt_gallery_b.gd -- /tmp/new-model-render/b
          test -s /tmp/new-model-render/a/gallery_three_quarter.png
          test -s /tmp/new-model-render/b/gallery_three_quarter.png
      - name: Preview review montage as compressed image in job log
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          python3 - <<'PY'
          from PIL import Image
          import base64, io
          paths=['/tmp/new-model-render/a/gallery_three_quarter.png','/tmp/new-model-render/b/gallery_three_quarter.png']
          panels=[]
          for name in paths:
              im=Image.open(name).convert('RGB')
              im.resize((540,1350),Image.Resampling.LANCZOS)
              panels.append(im.resize((540,1350),Image.Resampling.LANCZOS))
          out=Image.new('RGB',(1080,1350),(35,38,43))
          out.paste(panels[0],(0,0))
          out.paste(panels[1],(540,0))
          b=io.BytesIO()
          out.save(b,format='JPEG',quality=55,optimize=True)
          raw=base64.b64encode(b.getvalue()).decode()
          print('SCULPT_IMAGE_START|'+str(len(raw)))
          for i in range(0,len(raw),3000):
              print('SCULPT_IMAGE_CHUNK|'+str(i//3000)+'|'+raw[i:i+3000])
          print('SCULPT_IMAGE_END')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-chassis-five-angle-review
          path: /tmp/new-model-render/*/gallery_three_quarter.png
          if-no-files-found: ignore
