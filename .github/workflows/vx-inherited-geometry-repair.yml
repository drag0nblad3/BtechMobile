name: Targeted inherited Mech geometry repairs
on:
  push:
    branches: [chatgpt/repair-held-sculpts-compare-20261124]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.1-stable_linux.x86_64.zip
          mv Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
      - run: godot --headless --import
      - name: Validate actual geometry trials
        run: |
          set -o pipefail
          godot --headless -s tools/vx_repair_inherited_sculpts.gd 2>&1 | tee fine-repair.log
          ! grep -E 'SCRIPT ERROR|Parse Error|FINE_REPAIR_ERROR' fine-repair.log
          [ "$(grep -c '^FINE_REPAIR|' fine-repair.log)" -eq 28 ]
      - name: Commit accepted recipe repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/voxels/ docs/graphics/inherited-fine-repairs-20261124.json
          git commit -m "Repair inherited high-resolution disconnected hip and trim geometry"
          git push origin HEAD:chatgpt/repair-held-sculpts-compare-20261124
