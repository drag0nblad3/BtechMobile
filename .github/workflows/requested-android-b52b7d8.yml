name: Requested Android APK b52b7d8

# One-off user-requested build; do not merge this workflow.
on:
  pull_request:
    types: [opened]

env:
  GODOT_VERSION: 4.5.1

jobs:
  debug-apk:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chatgpt/build-android-b52b7d8'
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b52b7d884b1dedc4dca4f9191a8930abe2cc1623

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and Android export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

          curl -fsSL -o "$RUNNER_TEMP/templates.tpz" "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" 'templates/android_*' 'templates/version.txt' -d "$RUNNER_TEMP/tpl"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          mv "$RUNNER_TEMP"/tpl/templates/* "$dest/"

      - name: Restore persistent Android debug signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BTECH_DEBUG_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BTECH_DEBUG_KEYSTORE_PASSWORD }}
        run: |
          # Never generate a fresh key: it would break Android app updates.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing BTECH_DEBUG_KEYSTORE_BASE64 or BTECH_DEBUG_KEYSTORE_PASSWORD. See docs/android-signing.md."
            exit 1
          fi
          umask 077
          keystore="$RUNNER_TEMP/BtechMobile-debug.keystore"
          printf "%s" "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          keytool -list -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -alias btechmobile-debug > /dev/null
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=btechmobile-debug" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

          mkdir -p "$HOME/.config/godot"
          for name in editor_settings-4.tres "editor_settings-${GODOT_VERSION%.*}.tres"; do
            cat > "$HOME/.config/godot/$name" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$keystore"
          export/android/debug_keystore_user = "btechmobile-debug"
          export/android/debug_keystore_pass = "$KEYSTORE_PASSWORD"
          SETTINGS
          done
      - name: Import project
        run: '"$GODOT" --headless --import'

      - name: Export debug APK
        run: |
          mkdir -p build/android
          "$GODOT" --headless --export-debug "Android" build/android/BtechMobile-debug.apk
          test -s build/android/BtechMobile-debug.apk
          ls -la build/android

      - name: Verify exported APK uses the persistent certificate
        run: |
          signer_tool="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$signer_tool" ]; then
            echo "::error::Android apksigner was not found in Android SDK"
            exit 1
          fi
          expected="$(keytool -exportcert -rfc -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" \
            -storepass "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD" -alias btechmobile-debug 2>/dev/null \
            | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          actual="$("$signer_tool" verify --print-certs build/android/BtechMobile-debug.apk \
            | sed -n 's/^.*Signer: certificate SHA-256 digest: //p; s/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          # Pin the chosen debug certificate: secret replacement must not rotate the signing identity.
          pinned="02681a14bbdeeab1a09b2db5f68367e40a08628957fbec556d9b380749934237"
          if [ "$expected" != "$pinned" ]; then
            echo "::error::The repository secret contains a DIFFERENT signing certificate. Restore the original BtechMobile keystore."
            exit 1
          fi
          # apksigner prints "Signer #1 ..." or, with only a v3 signature, "Signer: ...".
          echo "APK signing certificate SHA-256: ${actual:-not detected}"
          if [ -z "$actual" ] || [ "$expected" != "$actual" ]; then
            echo "::error::APK signing certificate does not match stored signing key"
            exit 1
          fi
          echo "Verified persistent debug signing certificate: $actual"
      - uses: actions/upload-artifact@v4
        with:
          name: BtechMobile-debug-apk
          path: build/android/BtechMobile-debug.apk
          if-no-files-found: error
