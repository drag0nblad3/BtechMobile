name: Held Mech repairs and divergent render comparison
on:
  push:
    branches: [chatgpt/repair-held-sculpts-compare-20261124]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node tools/repair_held_sculpts.cjs
      - name: Commit strictly passing repaired source recipes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/voxels/ docs/graphics/held-sculpt-repair-20261124.json
          git commit -m "Repair held Mech source geometry with backed mounts and protected bores"
          git push origin HEAD:chatgpt/repair-held-sculpts-compare-20261124
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {start: 0, end: 4}
          - {start: 4, end: 8}
          - {start: 8, end: 11}
          - {start: 11, end: 14}
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.1-stable_linux.x86_64.zip
          mv Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
      - run: godot --headless --import
      - name: Capture matched views
        run: |
          set -o pipefail
          xvfb-run -a godot --rendering-method gl_compatibility --resolution 640x520 -s tools/capture_divergent_sculpts.gd -- /tmp/compare ${{ matrix.start }} ${{ matrix.end }} 2>&1 | tee compare.log
          ! grep -E 'SCRIPT ERROR|Parse Error|COMPARE_ERROR' compare.log
          [ "$(grep -c '^COMPARE_RENDER|' compare.log)" -eq "$((${{ matrix.end }}-${{ matrix.start }}))" ]
      - uses: actions/upload-artifact@v4
        with:
          name: divergent-mech-renders-${{ matrix.start }}
          path: /tmp/compare/*.png
          if-no-files-found: error
          retention-days: 30
