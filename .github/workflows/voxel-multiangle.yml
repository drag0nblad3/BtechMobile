name: Voxel connectivity and silhouette review

on:
  pull_request:
    paths:
      - 'data/voxels/*.json'
      - 'src/view/vox/vx_connectivity.gd'
      - 'src/view/vox/vx_model.gd'
      - 'src/view/vox/vx_silhouette.gd'
      - 'tests/unit/test_vx_connectivity.gd'
      - 'tests/unit/test_vx_silhouette.gd'
      - 'tools/voxel_multiangle_audit.gd'
      - 'tools/capture_silhouette_review.gd'
      - '.github/workflows/voxel-multiangle.yml'
  workflow_dispatch:

concurrency:
  group: voxel-multiangle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geometry:
    name: Connectivity, blind profiles, and 4-angle visual QA
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.5.1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/Godot_v4.5.1-stable_linux.x86_64" /usr/local/bin/godot
      - name: Import all scripts
        run: godot --headless --import
      - name: Focused generalized geometry tests
        run: |
          set -o pipefail
          godot --headless -s tests/run_tests.gd -- vx_connectivity 2>&1 | tee connectivity.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Compile Error' connectivity.log
          godot --headless -s tests/run_tests.gd -- vx_silhouette 2>&1 | tee silhouette.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Compile Error' silhouette.log
      - name: Audit every sculpt from front, side, quarter, top
        run: |
          set -o pipefail
          mkdir -p /tmp/voxel-qa
          godot --headless -s tools/voxel_multiangle_audit.gd -- /tmp/voxel-qa/report.json 2>&1 | tee catalog-audit.log
          test -s /tmp/voxel-qa/report.json
          ! grep -E 'SCRIPT ERROR|Parse Error|Compile Error' catalog-audit.log
          python3 - <<'PY'
          import json
          with open('/tmp/voxel-qa/report.json') as f:
              audit = json.load(f)
          print('Sculpt count:', audit['count'])
          print('Residual island parts:', audit['total_island_parts'])
          print('Residual weak joints:', audit['total_weak_joints'])
          if audit['total_island_parts'] or audit['total_weak_joints']:
              print('Topology regressions:', {
                  name: model['faults'] for name, model in audit['models'].items()
                  if model['faults']
              })
              raise SystemExit('No floating islands or weak joints allowed')
          print('Closest blind silhouette matches:')
          for item in audit['confusion_pairs'][:10]:
              print(item)
          PY
      - name: Render approved three chassis from four views
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 480s xvfb-run -a godot \
            --rendering-method gl_compatibility --resolution 1400x800 \
            -s tools/capture_full_voxels.gd -- /tmp/voxel-qa \
            2>&1 | tee voxel-render.log
          test -s /tmp/voxel-qa/atlas_wolverine_jenner_full_voxels.png
          ! grep -E 'SCRIPT ERROR|Parse Error|VOXELIZE_ERROR' voxel-render.log
      - name: Render seven reference candidates from three views
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 480s xvfb-run -a godot \
            --rendering-method gl_compatibility --resolution 1400x800 \
            -s tools/capture_silhouette_review.gd -- /tmp/voxel-qa \
            2>&1 | tee silhouette-review-render.log
          test -s /tmp/voxel-qa/seven_chassis_multiangle.png
          ! grep -E 'SCRIPT ERROR|Parse Error|SILHOUETTE_RENDER_ERROR' silhouette-review-render.log
      - name: Upload compact review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connectivity-multiangle-review
          path: |
            /tmp/voxel-qa/*.json
            /tmp/voxel-qa/*.png
            connectivity.log
            silhouette.log
            catalog-audit.log
            voxel-render.log
            silhouette-review-render.log
          if-no-files-found: warn
