name: One-time experimental sculpt materialization
on:
  push:
    branches: [chatgpt/promote-validated-mech-sculpts-20261124]
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replay exact selected geometry and write production recipes
        run: node tools/materialize_selected_sculpts.cjs
      - name: Commit only production data and provenance on the promotion branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/voxels/ docs/graphics/experimental-sculpt-promotion-20261124.json
          git diff --cached --stat
          git commit -m "Materialize all strictly clean replayable experimental Mech selections"
          git push origin HEAD:chatgpt/promote-validated-mech-sculpts-20261124
