name: Inspect public MUL search index
on:
  push:
    branches: [feature/era-faction-availability]
    paths: [tools/mul_index_probe.py, .github/workflows/mul-index-probe.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/mul_index_probe.py
