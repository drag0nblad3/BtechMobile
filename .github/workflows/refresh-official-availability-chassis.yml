name: Refresh official MUL data for new chassis
on:
  push:
    branches: [content/official-equipment-and-chassis-20261123]
    paths:
      - 'data/units/fafnir_fnr5.json'
      - 'data/units/huron_warrior_hurwor4l.json'
      - 'data/units/naginata_ngc3a.json'
      - 'data/units/anubis_abs3l.json'
      - 'data/units/no_dachi_nda1k.json'
      - 'data/units/hellstar.json'
      - 'data/units/war_dog_wrdg02fc.json'
      - 'data/units/men_shen_ms1o.json'
      - 'data/units/blood_asp_prime.json'
      - 'data/units/fire_falcon_prime.json'
      - 'data/units/regent_prime.json'
      - '.github/workflows/refresh-official-availability-chassis.yml'
permissions:
  contents: write
jobs:
  update-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update canonical unit and faction/era matrix with robots-compliant importer
        run: python3 tools/import_mul_availability.py
      - name: Commit only sourced MUL snapshot to this PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forces/availability.json docs/mul-import-coverage.json
          if git diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "data: sync exact MUL faction-era matrix for newly added chassis"
            git push origin HEAD:content/official-equipment-and-chassis-20261123
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-mul-chassis-coverage
          path: docs/mul-import-coverage.json
          if-no-files-found: warn
