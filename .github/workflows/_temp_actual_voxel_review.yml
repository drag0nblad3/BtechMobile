name: Temporary actual voxel geometry review - 21 new chassis
on:
  push:
    branches: ["art/new-source-mechs-shape-first-20261122"]
jobs:
  voxel:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.5.1-stable_linux.x86_64
          sudo mv /tmp/Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Capture actual coarse voxel geometry, including recessed muzzles and joint mass
        run: |
          set -euo pipefail
          godot --headless --import
          for n in 1 2 3 4 5 6 7; do
            mkdir -p /tmp/actual-voxel/$n
            timeout 155s xvfb-run -a godot --rendering-method gl_compatibility --resolution 1500x900 -s tools/_temporary_voxel_gallery_${n}.gd -- /tmp/actual-voxel/$n
          done
      - name: Provide compact actual-voxel image comparison in the logs
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          python3 - <<'PY'
          from PIL import Image
          import base64,io
          for group,indices in [("FIFTEEN",[1,2,3,4,5]),("SIX",[6,7])]:
              width=340
              out=Image.new("RGB",(width*len(indices),950),(34,37,42))
              for i,j in enumerate(indices):
                  im=Image.open(f"/tmp/actual-voxel/{j}/gallery_three_quarter.png").convert("RGB")
                  im=im.resize((width,950),Image.Resampling.LANCZOS)
                  out.paste(im,(width*i,0))
              b=io.BytesIO();out.save(b,format="JPEG",quality=55,optimize=True)
              raw=base64.b64encode(b.getvalue()).decode()
              for k in range(0,len(raw),3000):
                  print("VOXEL_"+group+"_CHUNK|"+str(k//3000)+"|"+raw[k:k+3000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-source-voxel-21-chassis-five-angle
          path: /tmp/actual-voxel/*/gallery_three_quarter.png
          if-no-files-found: ignore
