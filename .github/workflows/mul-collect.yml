name: Import canonical MUL availability
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/units/**'
      - 'tools/import_mul_availability.py'
      - '.github/workflows/mul-collect.yml'
  push:
    branches: [feature/era-faction-availability]
    paths:
      - tools/import_mul_availability.py
      - .github/workflows/mul-collect.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 8
    concurrency:
      group: mul-bulk-import
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Read official public MUL search index with robots-compliant pacing
        run: python3 tools/import_mul_availability.py
      - name: Commit official availability snapshot to source branch
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forces/availability.json docs/mul-import-coverage.json
          if git diff --cached --quiet; then echo "Snapshot unchanged."; else
            git commit -m "Sync all exact-variant faction-era records from MUL public index"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mul-import-coverage
          path: docs/mul-import-coverage.json
          if-no-files-found: ignore
