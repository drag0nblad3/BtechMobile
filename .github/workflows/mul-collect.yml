name: Import canonical MUL availability
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: mul-bulk-import
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Read official public MUL search index with robots-compliant pacing
        run: python3 tools/import_mul_availability.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mul-import-review-snapshot
          path: |
            docs/mul-import-coverage.json
            data/forces/availability.json
          if-no-files-found: ignore
