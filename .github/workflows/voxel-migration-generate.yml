name: Generate voxel catalog migration
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  generate:
    if: github.head_ref == 'refactor/voxel-data-migration' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Pack and verify all voxel recipes and adapt audited consumers
        run: python3 tools/migrate_voxel_catalog.py
      - name: Publish migrated data and consumer changes to migration branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/voxels tests/unit tools
          git diff --cached --quiet && exit 1
          git commit -m 'Migrate voxel catalog to lossless chassis-family shards and update direct readers'
          git push origin HEAD:refs/heads/refactor/voxel-data-migration
