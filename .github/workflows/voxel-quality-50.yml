name: Apply 50-pass voxel quality review
on:
  push:
    branches: [chatgpt/shape-first-batch24-20261121]
    paths:
      - tools/voxel_quality_50.py
      - .github/workflows/voxel-quality-50.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-source-refinement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/shape-first-batch24-20261121
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply fifty source geometry review passes per model
        run: python tools/voxel_quality_50.py
      - name: Commit verified source edits back to the draft branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/voxels docs/graphics/fifty_pass_source_quality_report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Art: apply 50 progressive shape and weapon-clarity passes across voxel catalog [skip ci]'
            git push origin HEAD:chatgpt/shape-first-batch24-20261121
          fi
