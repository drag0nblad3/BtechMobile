name: Reference camera and pose silhouette QA

on:
  pull_request:
    paths:
      - 'tools/reference_*.gd'
      - 'tools/export_reference_review_masks.gd'
      - 'tools/score_reference_silhouettes.py'
      - 'tools/score_first_reference_photos.py'
      - 'docs/graphics/first-reference-*.json'
      - 'docs/graphics/reference-stance-poses.json'
      - 'tests/unit/test_reference_*.gd'
      - 'tests/tools/test_score_reference_silhouettes.py'
      - '.github/workflows/voxel-reference-scoring.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  camera-pose-silhouette:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.5.1 (headless only)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/Godot_v4.5.1-stable_linux.x86_64" /usr/local/bin/godot
      - name: Install Pillow for transient photo masks
        run: python3 -m pip install --quiet --user Pillow
      - name: Import Godot classes
        run: godot --headless --import
      - name: Pose and camera projection tests
        run: |
          set -o pipefail
          godot --headless -s tests/run_tests.gd -- reference_camera | tee /tmp/camera-tests.log
          godot --headless -s tests/run_tests.gd -- reference_stance_rig | tee /tmp/stance-tests.log
          python3 -m unittest discover -s tests/tools -p 'test_score_reference_silhouettes.py'
      - name: Export two candidate pose-and-camera silhouette sets
        run: |
          set -o pipefail
          mkdir -p /tmp/reference-qa/models
          timeout 600s godot --headless -s tools/export_reference_review_masks.gd -- \
            /tmp/reference-qa/models \
            res://docs/graphics/first-reference-pose-hypotheses.json \
            phoenix_hawk,battleaxe | tee /tmp/reference-qa/export.log
          test -s /tmp/reference-qa/models/phoenix_hawk/quarter.txt
          test -s /tmp/reference-qa/models/battleaxe/front.txt
      - name: Fetch candidate photos, segment and measure exploratory score
        run: |
          python3 tools/score_first_reference_photos.py \
            --candidates docs/graphics/first-reference-photo-candidates.json \
            --models /tmp/reference-qa/models \
            --output /tmp/reference-qa/candidate-fit.json
          python3 - <<'PY'
          import json
          report = json.load(open('/tmp/reference-qa/candidate-fit.json'))
          for item in report['candidates']:
              print('PROVISIONAL_REFERENCE_FIT', item['model'], item['view'],
                    item.get('score_0_100'), item.get('error', ''))
          PY
      - name: Upload only masks and provisional metrics, never source photos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: initial-reference-camera-and-pose-qa
          path: |
            /tmp/reference-qa
            /tmp/camera-tests.log
            /tmp/stance-tests.log
          if-no-files-found: warn
