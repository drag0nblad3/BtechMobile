name: Rasterize battle icon assets (temporary)
on:
  push:
    branches:
      - feature/new-battletech-launcher-icon-20261122
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate native Android icon files
        run: |
          python -m pip install --disable-pip-version-check cairosvg pillow
          python - <<'PY'
          import os
          from pathlib import Path
          import cairosvg
          from PIL import Image
          out = Path("assets/branding")
          out.mkdir(parents=True, exist_ok=True)
          for source, name in [
              ("icon.svg", "icon_main.png"),
              ("icon_foreground.svg", "icon_foreground.png"),
              ("icon_background.svg", "icon_background.png")
          ]:
              cairosvg.svg2png(url=source, write_to=str(out/name),
                               output_width=512, output_height=512)
              im = Image.open(out/name).convert("RGBA")
              assert im.size == (512, 512)
          fg = Image.open(out/"icon_foreground.png").convert("RGBA")
          mask = fg.getchannel("A").point(lambda v: 255 if v >= 32 else 0)
          mono = Image.new("RGBA", fg.size, (255, 255, 255, 0))
          mono.putalpha(mask)
          mono.save(out/"icon_monochrome.png", optimize=True)
          assert Image.open(out/"icon_monochrome.png").size == (512, 512)
          PY
      - name: Commit rasterized icons to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/branding/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Add 512px Android launcher, adaptive and themed PNG assets"
            git push
          fi
