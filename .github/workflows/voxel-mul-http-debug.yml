name: Debug Sarna BattleTech wiki reference images
on:
  push:
    branches:
      - audit/mul-debug-20261123
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official-unit picture source pages and image URLs
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,re,html
          for slug in ['Alfar','Glass_Spider','Bulldog_Medium_Tank','Elemental_(Battle_Armor)','Hetzer','Rook']:
            url='https://www.sarna.net/wiki/'+slug
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 BtechMobileReferenceAudit/1.0'})
              with urllib.request.urlopen(req,timeout=20) as r:
                data=r.read(800000).decode('utf-8','replace')
              t=re.search(r'<title[^>]*>(.*?)</title>',data,re.I|re.S)
              table=re.search(r'<table[^>]*class="[^"]*infobox[^"]*"[^>]*>',data,re.I)
              img=re.findall(r'<img[^>]*src="([^"]+)"[^>]*>',data,re.I)[:3]
              print('SARNA_DEBUG',slug,'len',len(data),'title',html.unescape(t.group(1) if t else ''),'infobox',bool(table),'imgs',img,'head',repr(data[:100]))
            except Exception as e:
              print('SARNA_ERROR',slug,type(e).__name__,str(e))
          PY
