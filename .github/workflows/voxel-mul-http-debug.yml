name: Inspect archived vehicle reference filenames
on:
  push:
    branches: [audit/mul-debug-20261123]
permissions:
  contents: read
jobs:
  reference-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect actual listing and exact chassis basename
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from discover_tro_reference_art import fetch_index
          for category in ('vehicle','mech'):
            files=fetch_index(category)
            print('ARCHIVE_LIST',category,'size',len(files),'names',sorted(files)[:300] if category=='vehicle' else sorted(files)[:30])
          PY
