name: Probe official MUL import route
on:
  push:
    branches: [feature/era-faction-availability]
    paths: [tools/mul_probe.py, .github/workflows/mul-probe.yml]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/mul_probe.py
