name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.5.1

jobs:
  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and Android export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

          curl -fsSL -o "$RUNNER_TEMP/templates.tpz" "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" 'templates/android_*' 'templates/version.txt' -d "$RUNNER_TEMP/tpl"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          mv "$RUNNER_TEMP"/tpl/templates/* "$dest/"
          ls -la "$dest"

      - name: Configure Android SDK and debug keystore
        run: |
          keystore="$RUNNER_TEMP/debug.keystore"
          keytool -genkeypair -v -keystore "$keystore" -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

          mkdir -p "$HOME/.config/godot"
          for name in editor_settings-4.tres "editor_settings-${GODOT_VERSION%.*}.tres"; do
            cat > "$HOME/.config/godot/$name" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          done

      - name: Import project
        run: |
          "$GODOT" --headless --path game --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error" import.log; then exit 1; fi

      - name: Smoke test (run the main scene headless)
        run: |
          timeout 120 "$GODOT" --headless --path game --quit-after 300 2>&1 | tee run.log
          if grep -E "SCRIPT ERROR|Parse Error" run.log; then exit 1; fi

      - name: Export debug APK
        run: |
          mkdir -p build/android
          "$GODOT" --headless --path game --export-debug "Android" ../build/android/BtechMobile-debug.apk
          test -s build/android/BtechMobile-debug.apk
          ls -la build/android

      - uses: actions/upload-artifact@v4
        with:
          name: BtechMobile-debug-apk
          path: build/android/BtechMobile-debug.apk
          if-no-files-found: error
