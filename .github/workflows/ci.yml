name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.1-stable_linux.x86_64.zip
          mv Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import
        run: godot --headless --import
      - name: Unit tests
        run: |
          set -o pipefail
          godot --headless -s tests/run_tests.gd 2>&1 | tee test.log
          ! grep -E "SCRIPT ERROR|Parse Error" test.log
      - name: UI smoke (plays turns through the battle scene)
        run: |
          set -o pipefail
          godot --headless -s tools/ui_smoke.gd 2>&1 | tee ui.log
          godot --headless -s tools/ui_smoke.gd -- city 2>&1 | tee -a ui.log
          [ "$(grep -c "ui smoke ok" ui.log)" -eq 2 ]
          ! grep -E "SCRIPT ERROR|Parse Error" ui.log
      - name: Launcher navigation smoke
        run: |
          set -o pipefail
          godot --headless -s tools/launcher_smoke.gd 2>&1 | tee launcher.log
          grep -q "launcher navigation ok" launcher.log
          ! grep -E "SCRIPT ERROR|Parse Error" launcher.log
      - name: Voxel mech lab smoke
        run: |
          set -o pipefail
          godot --headless --quit-after 45 --scene res://scenes/voxel_mech_lab.tscn 2>&1 | tee voxel.log
          ! grep -E "SCRIPT ERROR|Parse Error" voxel.log
      - name: Claude voxel showcase smoke
        run: |
          set -o pipefail
          godot --headless --quit-after 90 --scene res://scenes/vx_showcase.tscn 2>&1 | tee vx.log
          ! grep -E "SCRIPT ERROR|Parse Error" vx.log
      - name: Render voxel gait comparison
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p /tmp/voxel-frames
          xvfb-run -a godot --rendering-method gl_compatibility --resolution 1280x720 \
            -s tools/capture_voxel_lab.gd -- /tmp/voxel-frames
          test -s /tmp/voxel-frames/gait_a.png
          test -s /tmp/voxel-frames/gait_b.png
          test -s /tmp/voxel-frames/armor_before.png
          test -s /tmp/voxel-frames/armor_after.png
          test -s /tmp/voxel-frames/digitigrade_a.png
          test -s /tmp/voxel-frames/digitigrade_b.png
          test -s /tmp/voxel-frames/catapult.png
          test -s /tmp/voxel-frames/atlas.png
          test -s /tmp/voxel-frames/hunchback.png
          test -s /tmp/voxel-frames/wolverine.png
          test -s /tmp/voxel-frames/jenner_stand.png
          ! cmp -s /tmp/voxel-frames/digitigrade_a.png /tmp/voxel-frames/digitigrade_b.png
          ! cmp -s /tmp/voxel-frames/gait_a.png /tmp/voxel-frames/gait_b.png
          ! cmp -s /tmp/voxel-frames/armor_before.png /tmp/voxel-frames/armor_after.png
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: voxel-mech-gait-frames
          path: /tmp/voxel-frames/*.png
      - name: Render refined Jenner chassis
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p /tmp/jenner-frames
          xvfb-run -a godot --rendering-method gl_compatibility --resolution 1280x720 \
            -s tools/capture_jenner.gd -- /tmp/jenner-frames
          for frame in jenner_front jenner_three_quarter jenner_side jenner_rear \
            jenner_stride_a jenner_stride_b jenner_damage; do
            test -s "/tmp/jenner-frames/$frame.png"
          done
          ! cmp -s /tmp/jenner-frames/jenner_stride_a.png /tmp/jenner-frames/jenner_stride_b.png
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: refined-jenner-model-renders
          path: /tmp/jenner-frames/*.png
      - name: Smoke run main scene
        run: |
          godot --headless --quit-after 30 2>&1 | tee run.log
          ! grep -E "SCRIPT ERROR|Parse Error" run.log
