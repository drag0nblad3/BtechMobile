name: CI
on: [push, pull_request, workflow_dispatch]
# Older shape-review pushes must not saturate the shared software renderer.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve editable shape-source snapshot for external visual review
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/component-shape-studies-20261120'
        uses: actions/upload-artifact@v4
        with:
          name: component-shape-json-source
          path: |
            data/voxels/atlas_shape.json
            data/voxels/wolverine_shape.json
            data/voxels/jenner_shape.json
      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.1-stable_linux.x86_64.zip
          mv Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import
        run: godot --headless --import
      - name: Render independent shape studies (no detail or APK)
        if: github.event_name == 'pull_request' && contains(github.head_ref, 'shape-')
        run: |
          set -o pipefail
          mkdir -p /tmp/component-shape-renders
          # Bound the Godot process even if a future rendering regression occurs.
          timeout --signal=TERM --kill-after=5s 120s xvfb-run -a godot --rendering-method gl_compatibility --resolution 1500x900 \
            -s tools/capture_component_shapes.gd -- /tmp/component-shape-renders 2>&1 | tee shape-render.log
          test -s /tmp/component-shape-renders/gallery_three_quarter.png
          [ "$(grep -c '^SHAPE_RENDER|' shape-render.log)" -eq 1 ]
          ! grep -E "SCRIPT ERROR|Parse Error|SHAPE_ERROR" shape-render.log
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && contains(github.head_ref, 'shape-')
        with:
          name: hand-authored-component-shape-renders
          path: /tmp/component-shape-renders/gallery_three_quarter.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request' && contains(github.head_ref, 'shape-')
        with:
          name: component-shape-render-log
          path: shape-render.log
          if-no-files-found: ignore
      - name: Battle persistence tests (fast feedback)
        run: |
          set -o pipefail
          godot --headless -s tests/run_tests.gd -- battle_save 2>&1 | tee battle-save-test.log
          ! grep -E "SCRIPT ERROR|Parse Error" battle-save-test.log
      - name: Battle save + replay scene smoke
        run: |
          set -o pipefail
          godot --headless -s tools/battle_save_smoke.gd 2>&1 | tee battle-save-smoke.log
          grep -q "battle save replay smoke ok" battle-save-smoke.log
          ! grep -E "SCRIPT ERROR|Parse Error" battle-save-smoke.log
      - name: Tactical Academy forensic unit tests
        run: |
          set -o pipefail
          godot --headless -s tests/run_tests.gd -- battle_forensics 2>&1 | tee academy-tests.log
          ! grep -E "SCRIPT ERROR|Parse Error" academy-tests.log
      - name: Cinematic toggle and Academy scene smoke
        run: |
          set -o pipefail
          godot --headless -s tools/academy_smoke.gd 2>&1 | tee academy-smoke.log
          grep -q "academy cinematic forensic smoke ok" academy-smoke.log
          ! grep -E "SCRIPT ERROR|Parse Error" academy-smoke.log
      - name: Unit tests
        run: |
          set -o pipefail
          godot --headless -s tests/run_tests.gd 2>&1 | tee test.log
          ! grep -E "SCRIPT ERROR|Parse Error" test.log
      - name: Report per-chassis voxel counts (no rendering)
        run: |
          set -o pipefail
          godot --headless -s tools/voxel_count_report.gd 2>&1 | tee voxel-counts.log
          [ "$(grep -c '^VOXEL_COUNT|' voxel-counts.log)" -eq 6 ]
          ! grep -E "SCRIPT ERROR|Parse Error" voxel-counts.log
      - uses: actions/upload-artifact@v4
        with:
          name: voxel-counts
          path: voxel-counts.log
      - name: Voxel battle 8/16 triangle and headless timing report
        run: |
          set -o pipefail
          godot --headless -s tools/voxel_battle_bench.gd 2>&1 | tee voxel-battle-bench.log
          grep -q 'VOXEL_BATTLE_BENCH|count=8|' voxel-battle-bench.log
          grep -q 'VOXEL_BATTLE_BENCH|count=16|' voxel-battle-bench.log
          ! grep -E "SCRIPT ERROR|Parse Error" voxel-battle-bench.log
      - uses: actions/upload-artifact@v4
        with:
          name: voxel-battle-timing
          path: voxel-battle-bench.log
      - name: Capture eight voxel battle units at phone resolution
        if: github.event_name == 'pull_request' && contains(github.head_ref, 'voxel-mechs-battle')
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 120s xvfb-run -a godot --rendering-method gl_compatibility --resolution 1280x720 \
            -s tools/capture.gd -- /tmp/battle-voxel.png voxel 2>&1 | tee voxel-capture.log
          test -s /tmp/battle-voxel.png
          ! grep -E "SCRIPT ERROR|Parse Error" voxel-capture.log
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && contains(github.head_ref, 'voxel-mechs-battle')
        with:
          name: battle-voxel-1280x720
          path: /tmp/battle-voxel.png
          if-no-files-found: error
      - name: UI smoke (plays turns through the battle scene)
        run: |
          set -o pipefail
          godot --headless -s tools/ui_smoke.gd 2>&1 | tee ui.log
          godot --headless -s tools/ui_smoke.gd -- city 2>&1 | tee -a ui.log
          [ "$(grep -c "ui smoke ok" ui.log)" -eq 2 ]
          ! grep -E "SCRIPT ERROR|Parse Error" ui.log
      - name: Battle visuals smoke (scene and effect lifetime)
        run: |
          set -o pipefail
          godot --headless -s tools/battle_visual_smoke.gd 2>&1 | tee battle-visual.log
          grep -q "battle visuals smoke ok" battle-visual.log
          ! grep -E "SCRIPT ERROR|Parse Error|BATTLE_VISUAL_FAILED" battle-visual.log
      - name: Capture battle visual review frames (Compatibility renderer)
        if: github.event_name == 'pull_request' && contains(github.head_ref, 'battlefield-vfx-hud-polish')
        run: |
          set -o pipefail
          mkdir -p /tmp/battle-visuals
          timeout --signal=TERM --kill-after=5s 120s xvfb-run -a godot --rendering-method gl_compatibility --resolution 1280x720 \
            -s tools/capture.gd -- /tmp/battle-visuals/city_vfx.png vfx 2>&1 | tee battle-capture.log
          test -s /tmp/battle-visuals/city_vfx.png
          ! grep -E "SCRIPT ERROR|Parse Error" battle-capture.log
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && contains(github.head_ref, 'battlefield-vfx-hud-polish')
        with:
          name: battlefield-polish-visual-review
          path: /tmp/battle-visuals/city_vfx.png
          if-no-files-found: error
      - name: Capture jump plume and muzzle preview (Compatibility renderer)
        if: github.event_name == 'pull_request' && contains(github.head_ref, 'weapon-sockets-jump-fx')
        run: |
          set -o pipefail
          mkdir -p /tmp/jump-review
          timeout --signal=TERM --kill-after=5s 110s xvfb-run -a godot --rendering-method gl_compatibility --resolution 1280x720 \
            -s tools/capture.gd -- /tmp/jump-review/jump.png jump 2>&1 | tee jump-capture.log
          timeout --signal=TERM --kill-after=5s 110s xvfb-run -a godot --rendering-method gl_compatibility --resolution 1280x720 \
            -s tools/capture.gd -- /tmp/jump-review/weapons.png vfx 2>&1 | tee -a jump-capture.log
          test -s /tmp/jump-review/jump.png
          test -s /tmp/jump-review/weapons.png
          ! cmp -s /tmp/jump-review/jump.png /tmp/jump-review/weapons.png
          ! grep -E "SCRIPT ERROR|Parse Error|CAPTURE_JUMP_FAILED" jump-capture.log
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && contains(github.head_ref, 'weapon-sockets-jump-fx')
        with:
          name: weapon-sockets-and-jump-review
          path: /tmp/jump-review/*.png
          if-no-files-found: error
      - name: Launcher navigation smoke
        run: |
          set -o pipefail
          godot --headless -s tools/launcher_smoke.gd 2>&1 | tee launcher.log
          grep -q "launcher navigation ok" launcher.log
          ! grep -E "SCRIPT ERROR|Parse Error" launcher.log
      - name: Force builder usability smoke
        run: |
          set -o pipefail
          godot --headless -s tools/force_builder_smoke.gd 2>&1 | tee force-builder.log
          grep -q "force builder smoke ok" force-builder.log
          ! grep -E "SCRIPT ERROR|Parse Error" force-builder.log
      - name: Voxel mech lab smoke
        run: |
          set -o pipefail
          godot --headless --quit-after 45 --scene res://scenes/voxel_mech_lab.tscn 2>&1 | tee voxel.log
          ! grep -E "SCRIPT ERROR|Parse Error" voxel.log
      - name: Twenty-mech stress test smoke (no rendering)
        run: |
          set -o pipefail
          godot --headless -s tools/voxel_stress_smoke.gd 2>&1 | tee voxel-stress.log
          grep -q "voxel stress smoke ok" voxel-stress.log
          ! grep -E "SCRIPT ERROR|Parse Error|VOXEL_STRESS_SMOKE_FAILED" voxel-stress.log
      - name: Claude voxel showcase smoke
        run: |
          set -o pipefail
          godot --headless --quit-after 90 --scene res://scenes/vx_showcase.tscn 2>&1 | tee vx.log
          ! grep -E "SCRIPT ERROR|Parse Error" vx.log
      - name: Render voxel gait comparison
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p /tmp/voxel-frames
          xvfb-run -a godot --rendering-method gl_compatibility --resolution 1280x720 \
            -s tools/capture_voxel_lab.gd -- /tmp/voxel-frames
          test -s /tmp/voxel-frames/gait_a.png
          test -s /tmp/voxel-frames/gait_b.png
          test -s /tmp/voxel-frames/armor_before.png
          test -s /tmp/voxel-frames/armor_after.png
          test -s /tmp/voxel-frames/digitigrade_a.png
          test -s /tmp/voxel-frames/digitigrade_b.png
          test -s /tmp/voxel-frames/catapult.png
          test -s /tmp/voxel-frames/atlas.png
          test -s /tmp/voxel-frames/hunchback.png
          test -s /tmp/voxel-frames/wolverine.png
          test -s /tmp/voxel-frames/jenner_stand.png
          ! cmp -s /tmp/voxel-frames/digitigrade_a.png /tmp/voxel-frames/digitigrade_b.png
          ! cmp -s /tmp/voxel-frames/gait_a.png /tmp/voxel-frames/gait_b.png
          ! cmp -s /tmp/voxel-frames/armor_before.png /tmp/voxel-frames/armor_after.png
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: voxel-mech-gait-frames
          path: /tmp/voxel-frames/*.png
      - name: Render refined Jenner chassis
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p /tmp/jenner-frames
          xvfb-run -a godot --rendering-method gl_compatibility --resolution 1280x720 \
            -s tools/capture_jenner.gd -- /tmp/jenner-frames
          for frame in jenner_front jenner_three_quarter jenner_side jenner_rear \
            jenner_stride_a jenner_stride_b jenner_damage; do
            test -s "/tmp/jenner-frames/$frame.png"
          done
          ! cmp -s /tmp/jenner-frames/jenner_stride_a.png /tmp/jenner-frames/jenner_stride_b.png
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: refined-jenner-model-renders
          path: /tmp/jenner-frames/*.png
      - name: Smoke run main scene
        run: |
          godot --headless --quit-after 30 2>&1 | tee run.log
          ! grep -E "SCRIPT ERROR|Parse Error" run.log
